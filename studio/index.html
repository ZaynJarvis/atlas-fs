<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenViking</title>
<script>
  // Apply the theme before first paint to avoid a flash (system / light / dark, Studio's .dark class).
  try {
    var m = JSON.parse(localStorage.getItem('atlas-studio-prefs') || '{}').theme || 'system';
    var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', d);
  } catch (e) {}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
